<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LixeirAI - Histórico</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y=".9em" font-size="90'>♻️</text></svg>">
</head>
<body>
  <div class="bg-animated"></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="container pb-navbar">
    <div class="page-header">
      <h1>📋 Histórico</h1>
      <span class="header-user" id="headerUser"></span>
    </div>

    <!-- Resumo -->
    <div class="stats-grid">
      <div class="card card-stat">
        <span class="stat-icon">🪙</span>
        <div class="stat-value" id="statPontos">0</div>
        <div class="stat-label">Pontos totais</div>
      </div>
      <div class="card card-stat">
        <span class="stat-icon">♻️</span>
        <div class="stat-value" id="statReciclagens">0</div>
        <div class="stat-label">Reciclagens</div>
      </div>
    </div>

    <!-- Lista de Histórico -->
    <div id="historicoLista">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </div>

  <nav class="navbar">
    <a class="nav-item" href="aplicativo.html">
      <span class="nav-icon">🏠</span>
      <span>Início</span>
    </a>
    <a class="nav-item active" href="historico.html">
      <span class="nav-icon">📋</span>
      <span>Histórico</span>
    </a>
    <a class="nav-item" href="beneficios.html">
      <span class="nav-icon">🎁</span>
      <span>Benefícios</span>
    </a>
    <a class="nav-item" onclick="fazerLogout()">
      <span class="nav-icon">🚪</span>
      <span>Sair</span>
    </a>
  </nav>

  <script src="js/historico.js"></script>
</body>
</html>
