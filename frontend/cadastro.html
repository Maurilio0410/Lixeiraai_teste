<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LixeirAI - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y=".9em" font-size="90'>♻️</text></svg>">
</head>
<body>
  <div class="bg-animated"></div>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <span class="logo-icon">🌱</span>
        <div class="logo-text">Lixeir<span>AI</span></div>
        <div class="logo-subtitle">Crie sua conta e comece a reciclar</div>
      </div>

      <div class="card">
        <form id="cadastroForm">
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" class="form-input" placeholder="Seu nome" required autocomplete="name">
            <div class="form-error" id="nomeError"></div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input" placeholder="seu@email.com" required autocomplete="email">
            <div class="form-error" id="emailError"></div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" class="form-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
            <div class="form-error" id="senhaError"></div>
          </div>

          <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" class="form-input" placeholder="Repita a senha" required autocomplete="new-password">
            <div class="form-error" id="confirmarSenhaError"></div>
          </div>

          <button type="submit" class="btn btn-primary" id="btnCadastro">
            ✅ Criar conta
          </button>
        </form>
      </div>

      <div class="auth-footer">
        <p>Já tem uma conta? <a href="index.html">Fazer login</a></p>
      </div>
    </div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
