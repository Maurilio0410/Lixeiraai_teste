
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/index.css">
    <script src="javascript/script_TelaLogin.js" defer></script>
    <script src="javascript/Cadastro.js"defer></script>

    <title>LixeirAI - Login</title>

</head>

<body>

    <section class="Containerpai">

        <div class="Card loginActive">


            <!-- ============================== -->
            <!--             LOGIN              -->
            <!-- ============================== -->

            <div class="Esquerda">

                <div class="FormLogin">

                    <h2>Tela de Login</h2>

                    <form id="FormLogin">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Digite seu email:"
                            required
                        >


                        <label for="loginSenha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="loginSenha"
                            placeholder="Digite sua senha:"
                            required
                        >


                        <button type="submit">
                            Login
                        </button>

                    </form>

                </div>


                <div class="FacaLogin">

                    <h2>
                        Já tem uma conta?
                    </h2>

                    <button
                        type="button"
                        class="LoginButton">

                        Faça Login

                    </button>
                    <a href="aplicativo.html">IR</a>
                </div>

            </div>



            <!-- ============================== -->
            <!--            CADASTRO             -->
            <!-- ============================== -->

            <div class="Direita">

                <div class="FormCadastro">

                    <h2>Cadastro</h2>


                    <form id="FormCadastro">


                        <label for="cadastroUsuario">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="cadastroUsuario"
                            placeholder="Digite seu nome:"
                            required
                        >


                        <label for="cadastroEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="cadastroEmail"
                            placeholder="Digite seu email:"
                            required
                        >


                        <label for="cadastroSenha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="cadastroSenha"
                            placeholder="Digite sua senha:"
                            required
                        >


                        <button type="submit">
                            Cadastrar
                        </button>


                    </form>

                </div>


                <div class="FacaCadastro">

                    <h2>
                        Não tem uma conta?
                    </h2>

                    <button
                        type="button"
                        class="cadastroButton">

                        Cadastre-se

                    </button>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
